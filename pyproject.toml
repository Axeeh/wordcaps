[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "wordcaps"
version = "0.1.0"
description = "Word-by-word karaoke captions for any video, generated and burned in locally with Whisper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/wordcaps/fonts/OFL.txt"]
authors = [{ name = "Alessio Carnevale" }]
requires-python = ">=3.11"
keywords = [
  "subtitles", "captions", "karaoke", "whisper", "whisper.cpp",
  "ffmpeg", "reels", "shorts", "tiktok", "video",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10.1",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wordcaps = "wordcaps.cli:main"

[project.urls]
Homepage = "https://github.com/Axeeh/wordcaps"
Issues = "https://github.com/Axeeh/wordcaps/issues"
Changelog = "https://github.com/Axeeh/wordcaps/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/wordcaps"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ffmpeg: needs ffmpeg and ffprobe on PATH",
  "whisper: needs a real Whisper backend and model (set WORDCAPS_TEST_MODEL)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
